<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101326">
  <title>Batalha — Astral Bastion TD</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/game.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body class="game-body">
  <div class="game-app">
    <header class="battle-hud glass">
      <a href="./index.html" class="icon-btn hud-back" aria-label="Menu">←</a>
      <div class="hud-stat"><span>❤</span><b id="livesHud">100</b></div>
      <div class="hud-stat"><span>◇</span><b id="moneyHud">650</b></div>
      <div class="hud-stat wave"><span>Rodada</span><b><span id="waveHud">0</span>/<span id="waveMaxHud">100</span></b></div>
      <div class="hud-spacer"></div>
      <button class="hud-button" id="pauseBtn">Ⅱ</button>
      <button class="hud-button" id="speedBtn">1×</button>
      <button class="hud-button auto" id="autoBtn">Auto: off</button>
      <button class="primary-btn hud-start" id="startWaveBtn">Iniciar</button>
    </header>

    <main class="battle-layout">
      <section class="canvas-stage" id="canvasStage">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <div id="toastLayer" class="toast-layer"></div>
        <div id="tutorialBox" class="tutorial-box glass hidden">
          <span class="eyebrow">TUTORIAL</span>
          <p id="tutorialText"></p>
          <div><button class="secondary-btn" id="skipTutorial">Pular</button><button class="primary-btn" id="nextTutorial">Continuar</button></div>
        </div>
        <div id="resultOverlay" class="result-overlay hidden">
          <div class="result-card glass"><span class="result-icon" id="resultIcon">✦</span><h2 id="resultTitle">Vitória</h2><p id="resultSummary"></p><div class="result-stats" id="resultStats"></div><div class="result-actions"><button class="secondary-btn" id="retryBtn">Tentar novamente</button><a class="primary-btn link-btn" href="./index.html">Menu principal</a></div></div>
        </div>
      </section>

      <aside class="tower-panel glass" id="towerPanel">
        <div class="empty-selection" id="emptySelection"><div class="orb">✦</div><b>Selecione um guardião</b><p>Clique em uma unidade posicionada para ver atributos, prioridade, upgrades e habilidade.</p></div>
        <div id="towerDetails" class="hidden"></div>
      </aside>
    </main>

    <footer class="hero-dock glass" id="heroDock"></footer>
  </div>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
